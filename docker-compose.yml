services:
  postgres:
    image: postgres:16-alpine
    container_name: sellora-catalog-db
    # POSTGRES_PASSWORD is read from the git-ignored .env file (see README).
    env_file:
      - .env
    environment:
      POSTGRES_DB: catalog_db
      POSTGRES_USER: sellora
    ports:
      - "5434:5432"
    volumes:
      - sellora_catalog_pgdata:/var/lib/postgresql/data

volumes:
  sellora_catalog_pgdata:
