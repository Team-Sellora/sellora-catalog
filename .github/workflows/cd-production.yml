name: CD - Deploy Production

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy-production:
    name: Deploy to Azure production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.403

      - name: Publish application
        run: |
          dotnet restore Sellora.CatalogService.sln
          dotnet publish \
            src/Sellora.CatalogService.Api/Sellora.CatalogService.Api.csproj \
            --configuration Release \
            --output ./publish \
            --no-self-contained

          test -f ./publish/Sellora.CatalogService.Api.dll
          test -f ./publish/Sellora.CatalogService.Api.runtimeconfig.json

      - name: Deploy to production
        uses: azure/webapps-deploy@v3
        with:
          app-name: sellora-organization
          publish-profile: ${{ secrets.AZURE_WEBAPP_PRODUCTION_PUBLISH_PROFILE }}
          package: ./publish

      - name: Validate deployed production startup
        shell: bash
        run: |
          set -euo pipefail
          HEALTH_URL="https://sellora-catalog-e9csg7h9gyhwf6hw.southeastasia-01.azurewebsites.net/health"
          WHOAMI_URL="https://sellora-catalog-e9csg7h9gyhwf6hw.southeastasia-01.azurewebsites.net/whoami"

          for attempt in {1..12}; do
            HEALTH_STATUS=$(curl \
              --silent \
              --output /dev/null \
              --write-out "%{http_code}" \
              "$HEALTH_URL" || true)

            WHOAMI_STATUS=$(curl \
              --silent \
              --output /tmp/whoami-response.txt \
              --write-out "%{http_code}" \
              "$WHOAMI_URL" || true)

            if [ "$HEALTH_STATUS" = "200" ] && { [ "$WHOAMI_STATUS" = "200" ] || [ "$WHOAMI_STATUS" = "401" ]; }; then
              echo "Production startup validation passed: /health=200 and /whoami responded with ${WHOAMI_STATUS}"
              exit 0
            fi

            echo "Attempt $attempt -> /health=${HEALTH_STATUS}, /whoami=${WHOAMI_STATUS}"
            sleep 10
          done

          echo "Production deployment validation failed: app did not start with expected runtime configuration"
          exit 1